# Swar Mangal — aaPanel Nginx reverse proxy config.
#
# Setup:
#   1. In aaPanel → Website → Add Site → enter your domain (e.g. api.swarmangal.in)
#   2. After the site is created, go to Settings → Config File
#   3. Replace the contents with this file (adjust ssl_certificate paths if needed)
#
# Or place this at:
#   /www/server/panel/vhost/nginx/swarmangal.conf
# then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name swarmangal.in www.swarmangal.in;

    client_max_body_size 5m;

    # Let's Encrypt cert paths — aaPanel generates these when you enable SSL
    # ssl_certificate     /www/server/panel/vhost/cert/swarmangal.in/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/swarmangal.in/privkey.pem;
    # include /www/server/panel/vhost/conf/letsencrypt.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint (no auth needed)
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
    }

    # Static assets — let Nginx serve directly for speed
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public assets (icons, manifest)
    location ~* ^/(icon|manifest|favicon) {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
    }
}
